# SonarQube analysis config, read by `pysonar`.
# The token is deliberately not stored here: export SONAR_TOKEN before scanning.
sonar.host.url=http://localhost:9000
sonar.projectKey=Agentic_AI_BNPP_Task
sonar.projectName=Agentic_AI_BNPP_Task

# Scan the whole repo; tests/ is indexed as test code, so keep it out of sources.
# Git-ignored files (coverage.xml, *.db, .scannerwork/) are skipped automatically.
sonar.sources=.
sonar.exclusions=tests/**
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10

# Produced by: coverage run -m unittest discover -s tests && coverage xml
sonar.python.coverage.reportPaths=coverage.xml
